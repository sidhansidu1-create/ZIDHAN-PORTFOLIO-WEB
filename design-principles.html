<body>

    <!-- Ambient Cyber Glows -->
    <div class="fb-ambient-bg" aria-hidden="true">
        <div class="fb-ambient-glow-1"></div>
        <div class="fb-ambient-glow-2"></div>
    </div>

    <!-- Main Flipbook Application -->
    <div class="fb-app">

        <!-- Top Header Navigation -->
        <header class="fb-header">
            <div class="fb-brand-section">
                <a href="index.html" class="fb-back-btn" title="Return to Main Portfolio">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>PORTFOLIO</span>
                </a>

                <div class="fb-brand-title">
                    <div class="fb-title-main">
                        <span>DESIGN PRINCIPLES</span>
                        <span class="fb-title-badge">FLIPBOOK</span>
                    </div>
                    <div class="fb-title-sub">Muhammed Sidhan (ZIDHANZID) Visual Architecture</div>

            </div>

            <div class="fb-actions">

                    <svg id="sound-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg id="sound-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>

                <!-- Zoom / Inspect Page (HD Detail Viewer) -->
                <button type="button" class="fb-btn-icon" id="zoom-btn" data-tooltip="Inspect Page (HD Zoom)" aria-label="Inspect Page Zoom">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="11" y1="8" x2="11" y2="14"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                </button>

                <!-- Download PDF Button -->
                <a href="pdf/DESIGN%20PRINCIPLES.pdf" download="DESIGN PRINCIPLES - Muhammed Sidhan.pdf" class="fb-btn-icon" id="download-btn" data-tooltip="Download Original PDF" aria-label="Download PDF">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </a>

                <!-- Share Link Button -->
                <button type="button" class="fb-btn-icon" id="share-btn" data-tooltip="Share / Copy Link" aria-label="Share Link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>

                <!-- Fullscreen Toggle -->
                <button type="button" class="fb-btn-icon" id="fullscreen-btn" data-tooltip="Toggle Fullscreen" aria-label="Toggle Fullscreen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Middle Flipbook Stage -->
        <main class="fb-stage">
            <!-- Left Chevron Arrow -->
            <button type="button" class="fb-nav-arrow fb-nav-arrow-prev" id="prev-arrow" aria-label="Previous Page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <!-- Book Viewport -->
            <div class="fb-viewport" id="flipbook-viewport">
                <div id="flipbook-book">
                    <!-- Dynamic pages injected by flipbook.js -->
                </div>
            </div>

            <!-- Right Chevron Arrow -->
            <button type="button" class="fb-nav-arrow fb-nav-arrow-next" id="next-arrow" aria-label="Next Page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <!-- Mobile Interactive Swipe Cue -->
            <div class="fb-swipe-hint" id="swipe-hint" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Swipe or tap edge to flip</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>

            <!-- Right Chevron Arrow -->
            <button type="button" class="fb-nav-arrow fb-nav-arrow-next" id="next-arrow" aria-label="Next Page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </main>

        <!-- Bottom Controller Dock -->
        <footer class="fb-footer">
            <div class="fb-dock">
                <!-- Jump to first page -->
                <button type="button" class="fb-dock-btn" id="dock-first" title="First Page" aria-label="First Page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 19 2 12 11 5 11 19"></polygon>
                        <polygon points="22 19 13 12 22 5 22 19"></polygon>
                    </svg>
                </button>

                <!-- Previous Page -->
                <button type="button" class="fb-dock-btn" id="dock-prev" title="Previous Page" aria-label="Previous Page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>

                <!-- Page Tracker & Input -->
                <div class="fb-page-indicator">
                    <span>Page</span>
                    <input type="number" id="page-input" class="fb-page-input" value="1" min="1" max="16" inputmode="numeric" pattern="[0-9]*" aria-label="Page number">
                    <span>of <span id="total-pages-label">16</span></span>
                </div>

                <!-- Page Scrub Slider -->
                <div class="fb-slider-wrap">
                    <input type="range" id="page-slider" class="fb-slider" min="1" max="16" value="1" aria-label="Page scrubber slider">
                </div>

                <!-- Next Page -->
                <button type="button" class="fb-dock-btn" id="dock-next" title="Next Page" aria-label="Next Page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>

                <!-- Jump to last page -->
                <button type="button" class="fb-dock-btn" id="dock-last" title="Last Page" aria-label="Last Page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 19 22 12 13 5 13 19"></polygon>
                        <polygon points="2 19 11 12 2 5 2 19"></polygon>
                    </svg>
                </button>

                <div class="fb-dock-divider"></div>

                <!-- Keyboard Hint -->
                <div class="fb-keyboard-hint">
                    <span class="fb-kbd">◄</span>
                    <span class="fb-kbd">►</span>
                    <span>Flip</span>
                </div>
            </div>
        </footer>

    </div>

    <!-- Elegant Cyberpunk Loading Screen -->
    <div class="fb-loader-overlay" id="loader-overlay">
        <div class="fb-loader-card">
            <div class="fb-spinner">
                <div class="fb-spinner-circle"></div>
            </div>
            <div class="fb-loader-title">DESIGN PRINCIPLES</div>
            <div class="fb-loader-status" id="loader-status">Initializing 3D Flipbook Engine...</div>
            <div class="fb-progress-bar-wrap">
                <div class="fb-progress-bar-fill" id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Element -->
    <div class="fb-toast" id="toast" role="status" aria-live="polite"></div>

    <!-- HD Page Inspection / Zoom Lightbox Modal (Optimized for Mobile) -->
    <div class="fb-zoom-modal" id="zoom-modal" role="dialog" aria-modal="true" aria-label="HD Page Inspector" hidden>
        <div class="fb-zoom-backdrop" id="zoom-backdrop"></div>
        <div class="fb-zoom-container">
            <div class="fb-zoom-header">
                <div class="fb-zoom-title" id="zoom-title">Page 1 of 16</div>
                <div class="fb-zoom-actions">
                    <span class="fb-zoom-tip">Pinch or scroll to zoom • Drag to pan</span>
                    <button type="button" class="fb-zoom-close" id="zoom-close-btn" aria-label="Close Zoom View">

                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="fb-zoom-body" id="zoom-body">
                <div class="fb-zoom-img-wrap" id="zoom-img-wrap">
                    <canvas id="zoom-canvas" class="fb-zoom-canvas"></canvas>
                </div>
            </div>
            <div class="fb-zoom-footer">
                <button type="button" class="fb-zoom-nav-btn" id="zoom-prev-btn" aria-label="Previous Page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                <span class="fb-zoom-page-indicator" id="zoom-page-badge">1 / 16</span>

                    <span>Next</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>

    <!-- Flipbook Controller Script -->
    <script src="flipbook.js?v=2.3"></script>
